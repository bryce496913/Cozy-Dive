<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Canonical fish inspection</title>
    <style>
      body {
        margin: 0;
        background: #183137;
        color: #e0e8db;
        font: 14px system-ui;
      }
      header {
        padding: 20px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px;
      }
      select,
      button {
        font: inherit;
        color: inherit;
        background: #2b4d52;
        border: 1px solid #88a59c;
        padding: 7px;
        margin-right: 8px;
      }
      #stage {
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 1100px;
      }
      #labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #labels span {
        position: absolute;
        transform: translate(-50%, 0);
        width: 200px;
        text-align: center;
        font-size: 12px;
      }
      pre {
        padding: 15px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Core fish library · migration Passes 017–018</h1>
      <p>31 identities · canonical geometry · existing movement controllers</p>
      <label
        >View
        <select id="view">
          <option>side</option>
          <option>front</option>
          <option>top</option>
          <option>three-quarter</option>
        </select></label
      ><label
        >Motion
        <select id="speed">
          <option value=".35">Slow / glide</option>
          <option value="1" selected>Normal</option>
          <option value="1.8">Burst</option>
        </select></label
      ><button id="pause">Pause</button><button id="release">Release</button
      ><button id="restore">Restore</button>
    </header>
    <div id="stage">
      <canvas></canvas>
      <div id="labels"></div>
    </div>
    <pre id="metrics"></pre>
    <script type="module" src="./inspection.ts"></script>
  </body>
</html>
